<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIS Ecommerce Projects</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .project-link {
            display: block;
            padding: 1.5rem;
            text-decoration: none;
            color: #333;
            border: 2px solid #eee;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .project-link:hover {
            border-color: #007bff;
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }
        .project-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #007bff;
        }
        .project-desc {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BIS Ecommerce Projects</h1>
        <div class="project-list">
            <a href="gourmet-haven-restaurant/index.html" class="project-link">
                <div class="project-title">Gourmet Haven Restaurant</div>
                <p class="project-desc">Premium dining experience with menu and reservations</p>
            </a>
            <a href="harizon-mobile-store/index.html" class="project-link">
                <div class="project-title">Harizon Mobile Store</div>
                <p class="project-desc">Modern mobile store for smartphones and accessories</p>
            </a>
        </div>
    </div>
</body>
</html>
